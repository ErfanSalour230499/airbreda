services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [airbreda]

  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on: [redis]
    networks: [airbreda]

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: traffic-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on: [redis]
    networks: [airbreda]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dashboard
    env_file: .env
    ports:
      - "8000:8000"
    networks: [airbreda]

networks:
  airbreda:
